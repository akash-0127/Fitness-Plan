name: Nutrition Data Sync

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run nutrition data sync
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: node sync-nutrition-data.js

      - name: Run foods database sync
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: node sync-foods-data.js

      - name: Commit and push if changed
        run: |
          if git diff --quiet HEAD -- nutrition-data.json foods-data.json sync-log.md; then
            echo "No data changes — skipping commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add nutrition-data.json foods-data.json sync-log.md
            git commit -m "chore: nutrition data sync $(date +%Y-%m-%d)"
            git push
          fi
